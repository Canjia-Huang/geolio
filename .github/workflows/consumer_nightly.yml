name: Consumer Nightly

# Runs daily at 00:00 UTC on the default branch.
#
# The per-OS `Consumer Linux` / `Consumer macOS` / `Consumer Windows` workflows verify the
# submodule consumption of the *default* configuration on every push and pull request: only
# GEOLIO_BUILD_TESTS is switched on there and every optional feature stays OFF. This nightly
# job covers the other half of the matrix - the same submodule checkout, but with all three
# optional features ON - so the consumer paths that only exist when MIQ is enabled are built
# and tested from a parent project as well: CoMISo pulled in by FetchContent, libigl found
# through find_package(libigl) in its installed package, and the MIQ sub-application
# registered in GeoBox. That is precisely the configuration geolio's own `Windows CI` /
# `Linux CI` / `macOS CI` and `Nightly` workflows build in-tree, but from outside the project.
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  test-consumption:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # ================================================================================================
      # Checkout geolio into a consumer project at consumer/third_party/geolio — the exact location a
      # parent repo would use after `git submodule add <geolio-url> third_party/geolio`.
      # `submodules: recursive` mirrors `git submodule update --init --recursive`, pulling geolio's
      # nested spdlog/CLI11/imoguizmo submodules that third_party/CMakeLists.txt references as
      # include dirs, plus googletest which GEOLIO_BUILD_TESTS pulls in through tests/CMakeLists.txt.
      # ================================================================================================

      - name: Checkout geolio as a submodule
        uses: actions/checkout@v6
        with:
          path: consumer/third_party/geolio
          submodules: 'recursive'

      # ================================================================================================
      # Install Geogram. geolio locates it through the GEOGRAM_DIR environment variable.
      # ================================================================================================

      - name: Install Dependency Geogram (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install cmake build-essential libx11-dev libxcb1-dev libxau-dev libxdmcp-dev
          sudo apt-get install libxi-dev libxcursor-dev libxinerama-dev libxrandr-dev
          sudo apt-get install libtbb-dev
          git clone --recurse-submodules https://github.com/BrunoLevy/geogram.git
          cd geogram
          echo "GEOGRAM_DIR=$(pwd)" >> $GITHUB_ENV
          ./configure.sh
          cd build/Linux64-gcc-dynamic-Release
          make -j

      - name: Install Dependency Geogram (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          git clone --recurse-submodules https://github.com/BrunoLevy/geogram.git
          cd geogram
          .\configure.bat
          $geogramRoot = Get-Location
          echo "GEOGRAM_DIR=$geogramRoot" >> $env:GITHUB_ENV
          cmake --build build/Windows --config Release --parallel

      - name: Install Dependency Geogram (macOS)
        if: runner.os == 'macOS'
        run: |
          git clone --recurse-submodules https://github.com/BrunoLevy/geogram.git
          cd geogram
          echo "GEOGRAM_DIR=$(pwd)" >> $GITHUB_ENV
          ./configure.sh
          cd build/Darwin-clang-dynamic-Release
          make -j

      # ================================================================================================
      # Install Eigen3. geolio finds it through find_package(Eigen3), which honors the Eigen3_DIR
      # environment variable in config mode.
      # ================================================================================================

      - name: Install Dependency Eigen3 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev

      - name: Install Dependency Eigen3 (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          $eigenVersion = "3.4.0"
          Invoke-WebRequest -Uri "https://gitlab.com/libeigen/eigen/-/archive/$eigenVersion/eigen-$eigenVersion.tar.gz" -OutFile "eigen.tar.gz"
          tar -xzf "eigen.tar.gz"
          # The release archive only ships Eigen3Config.cmake.in; running Eigen's own
          # CMake configure generates the real Eigen3Config.cmake into the build tree.
          cmake -S "eigen-$eigenVersion" -B "eigen-build"
          echo "Eigen3_DIR=$(Get-Location)/eigen-build" >> $env:GITHUB_ENV

      - name: Install Dependency Eigen3 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install eigen
          echo "Eigen3_DIR=$(brew --prefix eigen)/share/eigen3/cmake" >> $GITHUB_ENV

      # ================================================================================================
      # Install Dependency BLAS
      # ================================================================================================

      # Needed because this job turns GEOLIO_ENABLE_MIQ ON, which forces GEOLIO_ENABLE_COMISO ON:
      # CoMISo runs find_package(BLAS REQUIRED) on non-Apple UNIX. macOS links Accelerate and
      # Windows builds CoMISo with COMISO_NO_BLAS (see cmake/CoMISo.cmake), so this is Linux-only.
      - name: Install Dependency BLAS (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libblas-dev liblapack-dev

      # ================================================================================================
      # Install Dependency libigl
      # ================================================================================================

      # libigl is header-only: igl::core is an INTERFACE target, so these steps only configure and
      # copy headers, nothing is compiled. GEOLIO_ENABLE_MIQ consumes it through find_package(libigl),
      # i.e. the installed-package path - the one an external consumer can rely on. (LIBIGL_DIR,
      # the no-install fallback in cmake/libigl.cmake, covers source-tree builds instead.)
      # The per-OS consumer workflows do not install libigl: they build the default configuration,
      # where MIQ is OFF and cmake/libigl.cmake is never reached.

      - name: Install Dependency libigl (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 --branch v2.5.0 https://github.com/libigl/libigl.git
          # Every LIBIGL_* module option defaults to ON for a top-level libigl build, so
          # they are switched off explicitly: only igl::core is needed here, and the rest
          # would drag in CGAL, CoMISo, embree, imgui, glfw, tetgen and friends.
          cmake -S libigl -B libigl-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/libigl-install" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DLIBIGL_INSTALL=ON \
            -DLIBIGL_USE_STATIC_LIBRARY=OFF \
            -DLIBIGL_BUILD_TESTS=OFF \
            -DLIBIGL_BUILD_TUTORIALS=OFF \
            -DLIBIGL_COPYLEFT_CGAL=OFF \
            -DLIBIGL_COPYLEFT_COMISO=OFF \
            -DLIBIGL_COPYLEFT_TETGEN=OFF \
            -DLIBIGL_OPENGL=OFF \
            -DLIBIGL_IMGUI=OFF \
            -DLIBIGL_GLFW=OFF \
            -DLIBIGL_EMBREE=OFF \
            -DLIBIGL_SPECTRA=OFF \
            -DLIBIGL_XML=OFF \
            -DLIBIGL_STB=OFF \
            -DLIBIGL_PREDICATES=OFF \
            -DLIBIGL_CYCODEBASE=OFF \
            -DLIBIGL_RESTRICTED_TRIANGLE=OFF \
            -DLIBIGL_RESTRICTED_MATLAB=OFF \
            -DLIBIGL_RESTRICTED_MOSEK=OFF
          cmake --install libigl-build --config Release
          # find_package(libigl) reads libigl-config.cmake, which libigl installs to
          # <prefix>/lib/cmake/igl. The package is named `libigl` but that directory is
          # named `igl`, so CMAKE_PREFIX_PATH=<prefix> would NOT find it; the exact
          # <package>_DIR is used instead, and find_package also reads it from the
          # environment.
          echo "libigl_DIR=$PWD/libigl-install/lib/cmake/igl" >> "$GITHUB_ENV"

      - name: Install Dependency libigl (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          git clone --depth 1 --branch v2.5.0 https://github.com/libigl/libigl.git
          # Every LIBIGL_* module option defaults to ON for a top-level libigl build, so
          # they are switched off explicitly: only igl::core is needed here, and the rest
          # would drag in CGAL, CoMISo, embree, imgui, glfw, tetgen and friends.
          # $LASTEXITCODE is checked after each cmake call because PowerShell does not
          # fail a step on the non-zero exit of a native command by itself.
          cmake -S libigl -B libigl-build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$(Get-Location)/libigl-install" `
            -DCMAKE_INSTALL_LIBDIR=lib `
            -DLIBIGL_INSTALL=ON `
            -DLIBIGL_USE_STATIC_LIBRARY=OFF `
            -DLIBIGL_BUILD_TESTS=OFF `
            -DLIBIGL_BUILD_TUTORIALS=OFF `
            -DLIBIGL_COPYLEFT_CGAL=OFF `
            -DLIBIGL_COPYLEFT_COMISO=OFF `
            -DLIBIGL_COPYLEFT_TETGEN=OFF `
            -DLIBIGL_OPENGL=OFF `
            -DLIBIGL_IMGUI=OFF `
            -DLIBIGL_GLFW=OFF `
            -DLIBIGL_EMBREE=OFF `
            -DLIBIGL_SPECTRA=OFF `
            -DLIBIGL_XML=OFF `
            -DLIBIGL_STB=OFF `
            -DLIBIGL_PREDICATES=OFF `
            -DLIBIGL_CYCODEBASE=OFF `
            -DLIBIGL_RESTRICTED_TRIANGLE=OFF `
            -DLIBIGL_RESTRICTED_MATLAB=OFF `
            -DLIBIGL_RESTRICTED_MOSEK=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install libigl-build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          echo "libigl_DIR=$(Get-Location)/libigl-install/lib/cmake/igl" >> $env:GITHUB_ENV

      - name: Install Dependency libigl (macOS)
        if: runner.os == 'macOS'
        run: |
          git clone --depth 1 --branch v2.5.0 https://github.com/libigl/libigl.git
          # Every LIBIGL_* module option defaults to ON for a top-level libigl build, so
          # they are switched off explicitly: only igl::core is needed here, and the rest
          # would drag in CGAL, CoMISo, embree, imgui, glfw, tetgen and friends.
          cmake -S libigl -B libigl-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/libigl-install" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DLIBIGL_INSTALL=ON \
            -DLIBIGL_USE_STATIC_LIBRARY=OFF \
            -DLIBIGL_BUILD_TESTS=OFF \
            -DLIBIGL_BUILD_TUTORIALS=OFF \
            -DLIBIGL_COPYLEFT_CGAL=OFF \
            -DLIBIGL_COPYLEFT_COMISO=OFF \
            -DLIBIGL_COPYLEFT_TETGEN=OFF \
            -DLIBIGL_OPENGL=OFF \
            -DLIBIGL_IMGUI=OFF \
            -DLIBIGL_GLFW=OFF \
            -DLIBIGL_EMBREE=OFF \
            -DLIBIGL_SPECTRA=OFF \
            -DLIBIGL_XML=OFF \
            -DLIBIGL_STB=OFF \
            -DLIBIGL_PREDICATES=OFF \
            -DLIBIGL_CYCODEBASE=OFF \
            -DLIBIGL_RESTRICTED_TRIANGLE=OFF \
            -DLIBIGL_RESTRICTED_MATLAB=OFF \
            -DLIBIGL_RESTRICTED_MOSEK=OFF
          cmake --install libigl-build --config Release
          # find_package(libigl) reads libigl-config.cmake, which libigl installs to
          # <prefix>/lib/cmake/igl. The package is named `libigl` but that directory is
          # named `igl`, so CMAKE_PREFIX_PATH=<prefix> would NOT find it; the exact
          # <package>_DIR is used instead, and find_package also reads it from the
          # environment.
          echo "libigl_DIR=$PWD/libigl-install/lib/cmake/igl" >> "$GITHUB_ENV"

      # ================================================================================================
      # Parent project that consumes geolio as a submodule:
      #     add_subdirectory(third_party/geolio)
      # geolio's unit tests link Geolio::geolio, so building them inside the consumer
      # both verifies submodule consumption and runs the full test suite via CTest.
      # ================================================================================================

      - name: Create consumer project
        shell: bash
        run: |
          cat > consumer/CMakeLists.txt << 'CMAKEEOF'
          cmake_minimum_required(VERSION 3.30)
          project(GeolioConsumer LANGUAGES CXX)

          # Run geolio's own unit tests against the submodule build: they link
          # Geolio::geolio, so this verifies external consumption while exercising
          # the full test suite instead of a hand-written main() smoke test.
          enable_testing()
          set(GEOLIO_BUILD_TESTS ON CACHE BOOL "" FORCE)
          add_subdirectory(third_party/geolio)
          CMAKEEOF

      # The optional features default to OFF (see geolio's top-level CMakeLists.txt). This job
      # switches all three ON, which is what distinguishes it from the per-OS consumer workflows:
      # GEOLIO_ENABLE_MIQ forces GEOLIO_ENABLE_COMISO ON, so MIQ, CoMISo and LBFGS-Lite are all
      # compiled, linked and covered by the test suite from a submodule checkout.
      - name: Configure consumer
        run: cmake -B consumer/build -S consumer -DCMAKE_BUILD_TYPE=Release -DGEOLIO_ENABLE_LBFGS_LITE=ON -DGEOLIO_ENABLE_COMISO=ON -DGEOLIO_ENABLE_MIQ=ON

      - name: Build consumer (geolio + tests)
        run: cmake --build consumer/build --config Release --parallel

      # ================================================================================================
      # Run geolio's unit tests (built from the submodule) via CTest
      # ================================================================================================

      - name: Test
        working-directory: consumer/build
        run: ctest --output-on-failure -C Release
