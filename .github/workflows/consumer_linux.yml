name: Linux Consumer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-consumption:
    runs-on: ubuntu-latest

    steps:
      # ================================================================================================
      # Checkout geolio into a consumer project at consumer/third_party/geolio — the exact location a
      # parent repo would use after `git submodule add <geolio-url> third_party/geolio`.
      # `submodules: recursive` mirrors `git submodule update --init --recursive`, pulling geolio's
      # nested spdlog/CLI11/imoguizmo submodules that third_party/CMakeLists.txt references as
      # include dirs, plus googletest which GEOLIO_BUILD_TESTS pulls in through tests/CMakeLists.txt.
      # ================================================================================================

      - name: Checkout geolio as a submodule
        uses: actions/checkout@v6
        with:
          path: consumer/third_party/geolio
          submodules: 'recursive'

      # ================================================================================================
      # Install Geogram. geolio locates it through the GEOGRAM_DIR environment variable.
      #
      # The clone tracks geogram's default branch, so the build cache is keyed by the revision that
      # branch points at today: `git ls-remote` resolves it without a clone. The cached build tree
      # is shared with `Linux CI` and `Nightly` - same clone location, same configure.sh - and its
      # key ends in a manual salt that is bumped if the configuration below ever changes.
      # ================================================================================================

      - name: Resolve Dependency Geogram Revision
        id: geogram-rev
        run: |
          rev=$(git ls-remote https://github.com/BrunoLevy/geogram.git HEAD | cut -f1)
          # An empty revision would key the cache on nothing and silently reuse a stale
          # build tree, so a failed lookup fails the step instead.
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - name: Install Dependency Geogram
        run: |
          sudo apt-get install cmake build-essential libx11-dev libxcb1-dev libxau-dev libxdmcp-dev
          sudo apt-get install libxi-dev libxcursor-dev libxinerama-dev libxrandr-dev
          sudo apt-get install libtbb-dev
          git clone --recurse-submodules https://github.com/BrunoLevy/geogram.git
          echo "GEOGRAM_DIR=$(pwd)/geogram" >> $GITHUB_ENV

      - name: Restore Dependency Geogram Cache
        uses: actions/cache@v6
        with:
          path: geogram/build/Linux64-gcc-dynamic-Release
          key: geogram-${{ runner.os }}-${{ steps.geogram-rev.outputs.rev }}-v1

      - name: Build Dependency Geogram
        run: |
          cd geogram
          # The cache keeps the mtimes of the build it saved, while the sources were cloned a
          # moment ago and therefore look newer than every object file: touching the restored
          # tree makes configure.sh + make a no-op on a hit, and leaves make in charge of
          # filling in whatever the cache is missing (a build that was interrupted still
          # leaves a partially populated directory behind).
          if [ -d build/Linux64-gcc-dynamic-Release ]; then
            find build/Linux64-gcc-dynamic-Release -exec touch {} +
          fi
          ./configure.sh
          # -j"$(nproc)" instead of a bare `make -j`: an unbounded job count starts one compiler
          # per source file on a 4 vCPU runner, which is slow and memory hungry.
          make -C build/Linux64-gcc-dynamic-Release -j"$(nproc)"

      # ================================================================================================
      # Install Eigen3. geolio finds it through find_package(Eigen3), which honors the Eigen3_DIR
      # environment variable in config mode.
      # ================================================================================================

      - name: Install Dependency Eigen3
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev

      # ================================================================================================
      # Parent project that consumes geolio as a submodule:
      #     add_subdirectory(third_party/geolio)
      # geolio's unit tests link Geolio::geolio, so building them inside the consumer
      # both verifies submodule consumption and runs the full test suite via CTest.
      # ================================================================================================

      - name: Create consumer project
        shell: bash
        run: |
          cat > consumer/CMakeLists.txt << 'CMAKEEOF'
          cmake_minimum_required(VERSION 3.30)
          project(GeolioConsumer LANGUAGES CXX)

          # Run geolio's own unit tests against the submodule build: they link
          # Geolio::geolio, so this verifies external consumption while exercising
          # the full test suite instead of a hand-written main() smoke test.
          enable_testing()
          set(GEOLIO_BUILD_TESTS ON CACHE BOOL "" FORCE)
          add_subdirectory(third_party/geolio)
          CMAKEEOF

      - name: Configure consumer
        run: cmake -B consumer/build -S consumer -DCMAKE_BUILD_TYPE=Release

      # The job count is explicit: without one CMake hands GNU Make a bare `-j`, which
      # starts one compiler per ready target and is what exhausts a 4 vCPU runner on the
      # Release (-O3) configuration.
      - name: Build consumer (geolio + tests)
        run: cmake --build consumer/build --config Release --parallel "$(nproc)"

      # ================================================================================================
      # Run geolio's unit tests (built from the submodule) via CTest
      # ================================================================================================

      - name: Test
        working-directory: consumer/build
        run: ctest --output-on-failure -C Release
