name: Linux Consumer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-consumption:
    runs-on: ubuntu-latest

    steps:
      # ================================================================================================
      # Checkout geolio into a consumer project at consumer/third_party/geolio — the exact location a
      # parent repo would use after `git submodule add <geolio-url> third_party/geolio`.
      # `submodules: recursive` mirrors `git submodule update --init --recursive`, pulling geolio's
      # nested spdlog/CLI11/imoguizmo submodules that third_party/CMakeLists.txt references as
      # include dirs, plus googletest which GEOLIO_BUILD_TESTS pulls in through tests/CMakeLists.txt.
      # ================================================================================================

      - name: Checkout geolio as a submodule
        uses: actions/checkout@v6
        with:
          path: consumer/third_party/geolio
          submodules: 'recursive'

      # ================================================================================================
      # Install Geogram. geolio locates it through the GEOGRAM_DIR environment variable.
      # ================================================================================================

      - name: Install Dependency Geogram
        run: |
          sudo apt-get install cmake build-essential libx11-dev libxcb1-dev libxau-dev libxdmcp-dev
          sudo apt-get install libxi-dev libxcursor-dev libxinerama-dev libxrandr-dev
          sudo apt-get install libtbb-dev
          git clone --recurse-submodules https://github.com/BrunoLevy/geogram.git
          cd geogram
          echo "GEOGRAM_DIR=$(pwd)" >> $GITHUB_ENV
          ./configure.sh
          cd build/Linux64-gcc-dynamic-Release
          make -j

      # ================================================================================================
      # Install Eigen3. geolio finds it through find_package(Eigen3), which honors the Eigen3_DIR
      # environment variable in config mode.
      # ================================================================================================

      - name: Install Dependency Eigen3
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev

      # ================================================================================================
      # Parent project that consumes geolio as a submodule:
      #     add_subdirectory(third_party/geolio)
      # geolio's unit tests link Geolio::geolio, so building them inside the consumer
      # both verifies submodule consumption and runs the full test suite via CTest.
      # ================================================================================================

      - name: Create consumer project
        shell: bash
        run: |
          cat > consumer/CMakeLists.txt << 'CMAKEEOF'
          cmake_minimum_required(VERSION 3.30)
          project(GeolioConsumer LANGUAGES CXX)

          # Run geolio's own unit tests against the submodule build: they link
          # Geolio::geolio, so this verifies external consumption while exercising
          # the full test suite instead of a hand-written main() smoke test.
          enable_testing()
          set(GEOLIO_BUILD_TESTS ON CACHE BOOL "" FORCE)
          add_subdirectory(third_party/geolio)
          CMAKEEOF

      - name: Configure consumer
        run: cmake -B consumer/build -S consumer -DCMAKE_BUILD_TYPE=Release

      - name: Build consumer (geolio + tests)
        run: cmake --build consumer/build --config Release --parallel

      # ================================================================================================
      # Run geolio's unit tests (built from the submodule) via CTest
      # ================================================================================================

      - name: Test
        working-directory: consumer/build
        run: ctest --output-on-failure -C Release
