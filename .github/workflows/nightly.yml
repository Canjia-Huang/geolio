name: Nightly

# Runs daily at 00:00 UTC on the default branch.
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Release, Debug]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Setup MSBuild
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      # == Install Dependency Geogram =================================================================================

      - name: Install Dependency Geogram (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install cmake build-essential libx11-dev libxcb1-dev libxau-dev libxdmcp-dev
          sudo apt-get install libxi-dev libxcursor-dev libxinerama-dev libxrandr-dev
          sudo apt-get install libtbb-dev
          git clone --recurse-submodules https://github.com/BrunoLevy/geogram.git
          cd geogram
          echo "GEOGRAM_DIR=$(pwd)" >> $GITHUB_ENV
          ./configure.sh
          cd build/Linux64-gcc-dynamic-Release
          make -j

      - name: Install Dependency Geogram (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          git clone --recurse-submodules https://github.com/BrunoLevy/geogram.git
          cd geogram
          .\configure.bat
          $geogramRoot = Get-Location
          echo "GEOGRAM_DIR=$geogramRoot" >> $env:GITHUB_ENV
          # Build the configuration matching the matrix build type (Release or
          # Debug); the Build/Test steps below link the corresponding geogram lib.
          cmake --build build/Windows --config ${{ matrix.build_type }} --parallel (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors

      - name: Install Dependency Geogram (macOS)
        if: runner.os == 'macOS'
        run: |
          git clone --recurse-submodules https://github.com/BrunoLevy/geogram.git
          cd geogram
          echo "GEOGRAM_DIR=$(pwd)" >> $GITHUB_ENV
          ./configure.sh
          cd build/Darwin-clang-dynamic-Release
          make -j

      # == Install Dependency Eigen3 ==================================================================================

      - name: Install Dependency Eigen3 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev

      - name: Install Dependency Eigen3 (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          $eigenVersion = "3.4.0"
          Invoke-WebRequest -Uri "https://gitlab.com/libeigen/eigen/-/archive/$eigenVersion/eigen-$eigenVersion.tar.gz" -OutFile "eigen.tar.gz"
          tar -xzf "eigen.tar.gz"
          # The release archive only ships Eigen3Config.cmake.in; running Eigen's own
          # CMake configure generates the real Eigen3Config.cmake into the build tree.
          cmake -S "eigen-$eigenVersion" -B "eigen-build"
          echo "Eigen3_DIR=$(Get-Location)/eigen-build" >> $env:GITHUB_ENV

      - name: Install Dependency Eigen3 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install eigen
          echo "Eigen3_DIR=$(brew --prefix eigen)/share/eigen3/cmake" >> $GITHUB_ENV

      # == Install Dependency BLAS ====================================================================================

      # CoMISo - fetched by GEOLIO_ENABLE_COMISO, which GEOLIO_ENABLE_MIQ forces ON -
      # runs find_package(BLAS REQUIRED) on non-Apple UNIX. macOS links Accelerate and
      # Windows needs no BLAS package, so this is Linux-only.
      - name: Install Dependency BLAS (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libblas-dev liblapack-dev

      # == Install Dependency libigl ==================================================================================

      # libigl is header-only: igl::core is an INTERFACE target, so these steps only
      # configure and copy headers, nothing is compiled. GEOLIO_ENABLE_MIQ consumes it
      # through find_package(libigl).

      - name: Install Dependency libigl (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 --branch v2.5.0 https://github.com/libigl/libigl.git
          # Every LIBIGL_* module option defaults to ON for a top-level libigl build, so
          # they are switched off explicitly: only igl::core is needed here, and the rest
          # would drag in CGAL, CoMISo, embree, imgui, glfw, tetgen and friends.
          cmake -S libigl -B libigl-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/libigl-install" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DLIBIGL_INSTALL=ON \
            -DLIBIGL_USE_STATIC_LIBRARY=OFF \
            -DLIBIGL_BUILD_TESTS=OFF \
            -DLIBIGL_BUILD_TUTORIALS=OFF \
            -DLIBIGL_COPYLEFT_CGAL=OFF \
            -DLIBIGL_COPYLEFT_COMISO=OFF \
            -DLIBIGL_COPYLEFT_TETGEN=OFF \
            -DLIBIGL_OPENGL=OFF \
            -DLIBIGL_IMGUI=OFF \
            -DLIBIGL_GLFW=OFF \
            -DLIBIGL_EMBREE=OFF \
            -DLIBIGL_SPECTRA=OFF \
            -DLIBIGL_XML=OFF \
            -DLIBIGL_STB=OFF \
            -DLIBIGL_PREDICATES=OFF \
            -DLIBIGL_CYCODEBASE=OFF \
            -DLIBIGL_RESTRICTED_TRIANGLE=OFF \
            -DLIBIGL_RESTRICTED_MATLAB=OFF \
            -DLIBIGL_RESTRICTED_MOSEK=OFF
          cmake --install libigl-build --config Release
          # find_package(libigl) reads libigl-config.cmake, which libigl installs to
          # <prefix>/lib/cmake/igl. The package is named `libigl` but that directory is
          # named `igl`, so CMAKE_PREFIX_PATH=<prefix> would NOT find it; the exact
          # <package>_DIR is used instead, and find_package also reads it from the
          # environment.
          echo "libigl_DIR=$PWD/libigl-install/lib/cmake/igl" >> "$GITHUB_ENV"

      - name: Install Dependency libigl (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          git clone --depth 1 --branch v2.5.0 https://github.com/libigl/libigl.git
          # Every LIBIGL_* module option defaults to ON for a top-level libigl build, so
          # they are switched off explicitly: only igl::core is needed here, and the rest
          # would drag in CGAL, CoMISo, embree, imgui, glfw, tetgen and friends.
          # $LASTEXITCODE is checked after each cmake call because PowerShell does not
          # fail a step on the non-zero exit of a native command by itself.
          cmake -S libigl -B libigl-build `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_INSTALL_PREFIX="$(Get-Location)/libigl-install" `
            -DCMAKE_INSTALL_LIBDIR=lib `
            -DLIBIGL_INSTALL=ON `
            -DLIBIGL_USE_STATIC_LIBRARY=OFF `
            -DLIBIGL_BUILD_TESTS=OFF `
            -DLIBIGL_BUILD_TUTORIALS=OFF `
            -DLIBIGL_COPYLEFT_CGAL=OFF `
            -DLIBIGL_COPYLEFT_COMISO=OFF `
            -DLIBIGL_COPYLEFT_TETGEN=OFF `
            -DLIBIGL_OPENGL=OFF `
            -DLIBIGL_IMGUI=OFF `
            -DLIBIGL_GLFW=OFF `
            -DLIBIGL_EMBREE=OFF `
            -DLIBIGL_SPECTRA=OFF `
            -DLIBIGL_XML=OFF `
            -DLIBIGL_STB=OFF `
            -DLIBIGL_PREDICATES=OFF `
            -DLIBIGL_CYCODEBASE=OFF `
            -DLIBIGL_RESTRICTED_TRIANGLE=OFF `
            -DLIBIGL_RESTRICTED_MATLAB=OFF `
            -DLIBIGL_RESTRICTED_MOSEK=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install libigl-build --config ${{ matrix.build_type }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          echo "libigl_DIR=$(Get-Location)/libigl-install/lib/cmake/igl" >> $env:GITHUB_ENV

      - name: Install Dependency libigl (macOS)
        if: runner.os == 'macOS'
        run: |
          git clone --depth 1 --branch v2.5.0 https://github.com/libigl/libigl.git
          # Every LIBIGL_* module option defaults to ON for a top-level libigl build, so
          # they are switched off explicitly: only igl::core is needed here, and the rest
          # would drag in CGAL, CoMISo, embree, imgui, glfw, tetgen and friends.
          cmake -S libigl -B libigl-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/libigl-install" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DLIBIGL_INSTALL=ON \
            -DLIBIGL_USE_STATIC_LIBRARY=OFF \
            -DLIBIGL_BUILD_TESTS=OFF \
            -DLIBIGL_BUILD_TUTORIALS=OFF \
            -DLIBIGL_COPYLEFT_CGAL=OFF \
            -DLIBIGL_COPYLEFT_COMISO=OFF \
            -DLIBIGL_COPYLEFT_TETGEN=OFF \
            -DLIBIGL_OPENGL=OFF \
            -DLIBIGL_IMGUI=OFF \
            -DLIBIGL_GLFW=OFF \
            -DLIBIGL_EMBREE=OFF \
            -DLIBIGL_SPECTRA=OFF \
            -DLIBIGL_XML=OFF \
            -DLIBIGL_STB=OFF \
            -DLIBIGL_PREDICATES=OFF \
            -DLIBIGL_CYCODEBASE=OFF \
            -DLIBIGL_RESTRICTED_TRIANGLE=OFF \
            -DLIBIGL_RESTRICTED_MATLAB=OFF \
            -DLIBIGL_RESTRICTED_MOSEK=OFF
          cmake --install libigl-build --config Release
          # find_package(libigl) reads libigl-config.cmake, which libigl installs to
          # <prefix>/lib/cmake/igl. The package is named `libigl` but that directory is
          # named `igl`, so CMAKE_PREFIX_PATH=<prefix> would NOT find it; the exact
          # <package>_DIR is used instead, and find_package also reads it from the
          # environment.
          echo "libigl_DIR=$PWD/libigl-install/lib/cmake/igl" >> "$GITHUB_ENV"

      # == Configure and make =========================================================================================

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DGEOLIO_ENABLE_MIQ=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # == Test =======================================================================================================

      - name: Test
        working-directory: build
        run: ctest --output-on-failure -C ${{ matrix.build_type }}
